name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install Python requirements
      run: pip install -r py/requirements.txt
    - name: PETSc cache
      id: petsc-cache
      uses: actions/cache@v5
      with:
        path: petsc
        key: ${{ runner.os }}-petsc-cache
    - name: Build PETSc
      if: steps.petsc-cache.outputs.cache-hit != 'true'
      run: |
          git clone https://gitlab.com/petsc/petsc.git
          cd petsc
          git checkout 63b725033a15f75ded7183cf5f88ec748e60783b
          ./configure --with-fc=0 --with-cxx=0 --with-cc=gcc --download-sundials2 --download-mpich --download-f2cblaslapack PETSC_ARCH=arch-test
          make all
    - name: make
      run: PETSC_DIR=petsc PETSC_ARCH=arch-test make
    - name: Test with SciATH
      run: |
          cd tests && git clone https://github.com/sciath/sciath --depth=1 && cd -
          export PYTHONPATH=$PYTHONPATH:$PWD/tests/sciath
          mkdir -p test_dir && cd test_dir
          python -m sciath -d -w pth.conf
          python -m sciath -f -w pth.conf ../tests/tests.yml
    - name: Archive test results
      uses: actions/upload-artifact@v6
      if : always()
      with:
        name: spider-sciath-test-dir
        path: test_dir

  installer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Python requirements
        run: pip install -r py/requirements.txt
      - name: Run installer
        run: ./tools/get_spider.sh
      - name: Test with SciATH
        run: |
          cd tests && git clone https://github.com/sciath/sciath --depth=1 && cd -
          export PYTHONPATH=$PYTHONPATH:$PWD/tests/sciath
          mkdir -p test_dir && cd test_dir
          python -m sciath -d -w pth.conf
          python -m sciath -f -w pth.conf ../tests/tests.yml
      - name: Surface failure diagnostics
        if: failure()
        run: |
          mkdir -p test_dir
          echo "=== SciATH report ==="
          cat test_dir/sciath_test_report.txt 2>/dev/null || echo "(no report produced)"
          echo "=== SciATH stdout/stderr ==="
          find test_dir -type f \( -name '*.stdout' -o -name '*.stderr' \) -print -exec cat {} + 2>/dev/null || true
          echo "=== toolchain provenance ==="
          {
            echo "# uname"; uname -a
            echo "# gcc"; gcc --version 2>/dev/null | head -1
            echo "# spider ldd"; ldd ./spider 2>/dev/null || true
            echo "# petsc mpichversion"; ./petsc/*/bin/mpichversion 2>/dev/null | head -5 || true
          } | tee test_dir/provenance.txt
          cp -r logs test_dir/build_logs 2>/dev/null || true
          find petsc -maxdepth 4 -name configure.log -exec cp {} test_dir/petsc-configure.log \; 2>/dev/null || true
      - name: Archive test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: spider-sciath-test-dir-${{ github.job }}
          path: test_dir
          overwrite: true
          retention-days: 90
