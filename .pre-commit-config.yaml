# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
#
# The whitespace hooks exclude vendored code (cJSON), binary-adjacent data
# tables (lookup_data, expected_output, tests/data), and the LaTeX notes,
# so that only maintained sources are ever rewritten.
---
exclude: '^(cJSON\.(c|h)|lookup_data/|tests/expected_output/|tests/data/|notes/|dev/)'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-builtin-literals
      - id: check-ast
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: check-file-sizes
        name: Check copilot-instructions.md line limit
        entry: bash tools/check_file_sizes.sh
        language: system
        files: \.github/copilot-instructions\.md$
        pass_filenames: false
